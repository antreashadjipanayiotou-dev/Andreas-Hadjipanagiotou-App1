name: Build Andreas Hadjipanayiotou APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find Android project
        shell: bash
        run: |
          echo "Searching for Gradle Android project..."

          PROJECT_FILE=$(find . -type f \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: No
